version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db

  # --- APIS EM PYTHON ---
  rest_py:
    build: 
      context: .
      dockerfile: python/Dockerfile
    command: uvicorn rest_app:app --host 0.0.0.0 --port 8000 --workers 4
    ports: ["8000:8000"]
    depends_on: [db]
  graphql_py:
    build: 
      context: .
      dockerfile: python/Dockerfile
    command: uvicorn graphql_app:app --host 0.0.0.0 --port 8001 --workers 4
    ports: ["8001:8001"]
    depends_on: [db]
  soap_py:
    build: 
      context: .
      dockerfile: python/Dockerfile
    command: gunicorn -w 4 -b 0.0.0.0:8002 soap_app:wsgi_app
    ports: ["8002:8002"]
    depends_on: [db]
  grpc_py:
    build: 
      context: .
      dockerfile: python/Dockerfile
    command: python grpc_app.py
    ports: ["50051:50051"]
    depends_on: [db]

  # --- APIS EM TYPESCRIPT ---
  rest_ts:
    build: 
      context: .
      dockerfile: typescript/Dockerfile
    command: pm2-runtime start dist/rest_app.js -i 4
    ports: ["9000:9000"]
    depends_on: [db]
  graphql_ts:
    build: 
      context: .
      dockerfile: typescript/Dockerfile
    command: pm2-runtime start dist/graphql_app.js -i 4
    ports: ["9001:9001"]
    depends_on: [db]
  soap_ts:
    build: 
      context: .
      dockerfile: typescript/Dockerfile
    command: pm2-runtime start dist/soap_app.js -i 4
    ports: ["9002:9002"]
    depends_on: [db]
  grpc_ts:
    build: 
      context: .
      dockerfile: typescript/Dockerfile
    command: node dist/grpc_app.js
    ports: ["50052:50052"]
    depends_on: [db]

  # --- LOCUST ---
  locust:
    build: 
      context: .
      dockerfile: python/Dockerfile
    command: locust -f locustfile.py
    ports: ["8089:8089"]
    depends_on: [rest_py, rest_ts] # Garante que só sobe depois de algumas APIs
    # VOLUME REMOVIDO PARA NÃO SOBREESCREVER OS ARQUIVOS COMPILADOS!

volumes:
  pgdata: